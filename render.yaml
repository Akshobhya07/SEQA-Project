databases:
  - name: seqa-postgres
    databaseName: seqa_db
    user: postgres
    plan: free

services:
  - type: web
    name: seqa-rollback-audit-manager
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seqa-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: "*"
